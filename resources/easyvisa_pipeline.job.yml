resources:
  jobs:
    easyvisa_training_pipeline:
      name: "[${var.env}] EasyVisa Training Pipeline"
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: data_ingestion
          environment_key: serverless_env
          spark_python_task:
            python_file: ${workspace.file_path}/workflows/01_data_ingestion.py
            parameters: ["--env", "${var.env}", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

        - task_key: feature_engineering
          depends_on:
            - task_key: data_ingestion
          environment_key: serverless_env
          spark_python_task:
            python_file: ${workspace.file_path}/workflows/02_feature_engineering.py
            parameters: ["--env", "${var.env}", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

        - task_key: model_training
          depends_on:
            - task_key: feature_engineering
          environment_key: serverless_env
          spark_python_task:
            python_file: ${workspace.file_path}/workflows/03_model_training.py
            parameters: ["--env", "${var.env}", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

        - task_key: batch_inference
          depends_on:
            - task_key: model_training
          environment_key: serverless_env
          spark_python_task:
            python_file: ${workspace.file_path}/workflows/04_inference.py
            parameters: ["--env", "${var.env}", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

    easyvisa_monitoring:
      name: "[${var.env}] EasyVisa Drift Monitoring"
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "UTC"
      tasks:
        - task_key: monitoring
          environment_key: serverless_env
          spark_python_task:
            python_file: ${workspace.file_path}/workflows/05_model_monitoring.py
            parameters: ["--env", "${var.env}", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]


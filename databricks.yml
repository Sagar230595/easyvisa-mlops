bundle:
  name: easyvisa-mlops

include:
  - resources/*.yml

# Build the wheel so the job clusters can `import easyvisa`
artifacts:
  easyvisa_wheel:
    type: whl
    build: python setup.py bdist_wheel
    path: .

variables:
  env:
    description: Logical environment name passed to the jobs.
    default: dev
  catalog:
    description: Unity Catalog catalog.
    default: onedatalakehouse_datascience_we
  schema:
    description: Unity Catalog schema.
    default: easyvisa_dev
  node_type_id:
    description: Cluster node type.
    default: Standard_DS3_v2

resources:
  apps:
    easyvisa_app:
      name: easyvisa-predictor-${var.env}
      source_code_path: .

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-012dffbd-0345.cloud.databricks.com
    variables:
      env: dev
      schema: easyvisa_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-012dffbd-0345.cloud.databricks.com
    variables:
      env: prod
      schema: easyvisa_prod
    run_as:
      service_principal_name: REPLACE-WITH-SERVICE-PRINCIPAL-APP-ID

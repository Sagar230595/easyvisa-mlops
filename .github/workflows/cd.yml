name: CD

on:
  push:
    branches: [main]        # deploy to dev on merge to main. 
    tags: ["v*"]            # deploy to prod on a version tag.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build + CLI
        run: |
          pip install wheel setuptools
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Select target
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bundle
        run: databricks bundle validate -t ${{ steps.target.outputs.target }}

      - name: Deploy bundle
        run: databricks bundle deploy -t ${{ steps.target.outputs.target }}

      - name: Deploy App Container
        run: |
          APP_PATH=$(databricks bundle summary -t ${{ steps.target.outputs.target }} -o json | jq -r '.resources.apps.easyvisa_app.source_code_path')
          databricks apps deploy easyvisa-predictor-${{ steps.target.outputs.target }} --source-code-path "$APP_PATH"
